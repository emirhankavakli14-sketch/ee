name: GÜNDEM. — Günlük gazeteyi güncelle

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Türkiye saatiyle her sabah 07.37; GitHub yoğunluğunda gecikebilir.
    - cron: '37 7 * * *'
      timezone: 'Europe/Istanbul'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gundem-gazete
  cancel-in-progress: false

jobs:
  guncelle-ve-yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Günlük haber bültenini üret
        run: python update_news.py
      - name: Güncel baskıyı arşivle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edition.json
          if ! git diff --cached --quiet; then
            git commit -m "Günlük baskı: $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p public
          cp index.html edition.json manifest.webmanifest sw.js icon-192.png icon-512.png public/
      - name: GitHub Pages yapılandır
        uses: actions/configure-pages@v5
      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'public'
      - name: Yeni baskıyı yayımla
        id: deployment
        uses: actions/deploy-pages@v4
