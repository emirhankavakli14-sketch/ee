name: GUNDEM - Gunluk Gazete

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gundem-pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: $&#123;&#123; steps.deployment.outputs.page_url &#125;&#125;
    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Haberleri guncelle
        run: python update_news.py
      - name: Gazeteyi arsivle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edition.json
          if ! git diff --cached --quiet; then
            git commit -m "Gunluk gazete guncellemesi"
            git push
          fi
      - name: Yayin dosyalarini hazirla
        run: |
          mkdir -p public
          cp index.html edition.json manifest.webmanifest sw.js icon-192.png icon-512.png public/
      - name: Pages yapilandir
        uses: actions/configure-pages@v5
      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Siteyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
